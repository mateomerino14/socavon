name: Publicar versión

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable
  TEMPLATES_DIR: ~/.local/share/godot/export_templates/4.7.2.stable

permissions:
  contents: write

jobs:
  windows:
    name: Exporta para Windows y publica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descarga Godot y las plantillas de Windows
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ${{ env.TEMPLATES_DIR }}
          unzip -j -q templates.tpz "templates/windows_release_x86_64.exe" "templates/windows_debug_x86_64.exe" "templates/version.txt" -d ${{ env.TEMPLATES_DIR }}
          rm templates.tpz
      - name: Importa y exporta
        run: |
          ./godot --headless --path . --import
          mkdir -p build/Socavon
          ./godot --headless --path . --export-release "Windows Desktop" build/Socavon/Socavon.exe
          cp docs/LEEME.txt docs/LICENCIAS.txt build/Socavon/
      - name: Lee la versión del proyecto
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Empaqueta
        run: |
          name="Socavon-${VERSION}-windows.zip"
          (cd build && zip -q -r "../${name}" Socavon)
          echo "ZIP=${name}" >> "$GITHUB_ENV"
      - name: Publica en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" "${ZIP}" --clobber
          else
            gh release create "v${VERSION}" "${ZIP}" --target "${GITHUB_SHA}" \
              --title "Socavón ${VERSION}" --notes-file docs/notas_version.md --prerelease
          fi
      - name: Guarda el paquete
        uses: actions/upload-artifact@v4
        with:
          name: socavon-windows
          path: ${{ env.ZIP }}
